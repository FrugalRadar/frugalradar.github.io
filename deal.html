<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening deal in FrugalRadar…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F3FAF6;
      color: #0D2E1C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    p  { font-size: 15px; color: #4A6358; margin: 0 0 32px; }
    .btn {
      display: inline-block;
      background: #0D3D2A;
      color: #fff;
      padding: 16px 32px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .store-links { margin-top: 24px; font-size: 13px; color: #7AAD8E; }
    .store-links a { color: #1A7A4A; text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="logo">🎯</div>
  <h1>Opening in FrugalRadar</h1>
  <p>If the app doesn't open automatically, tap the button below.</p>
  <a id="deeplink" class="btn" href="#">Open Deal</a>
  <div class="store-links">
    Don't have the app?
    <a href="https://apps.apple.com/app/frugalradar/idPLACEHOLDER">App Store</a> ·
    <a href="https://play.google.com/store/apps/details?id=com.abidelabs.frugalradar">Google Play</a>
  </div>

  <script>
    // Extract /deal/<id> from path
    const parts = window.location.pathname.split('/');
    const dealIdx = parts.indexOf('deal');
    const dealId = dealIdx !== -1 ? parts[dealIdx + 1] : null;

    if (dealId) {
      const appUrl = 'frugalradar://deal/' + dealId;
      document.getElementById('deeplink').href = appUrl;
      // Auto-open on mobile
      window.location.href = appUrl;
    }
  </script>
</body>
</html>
